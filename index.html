<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1320">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Les mesures de l'informatique en 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0e16;color:#e8edf5;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  #app{display:flex;height:100vh;height:100dvh}
  #stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#1b2840 0%,#0d1320 60%,#080b12 100%);touch-action:none}
  #c{display:block;width:100%;height:100%;cursor:grab}
  #c:active{cursor:grabbing}
  #badges{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .badge{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#ff7a1a;color:#10131a;border:2px solid #fff;font:700 11px/16px Arial,sans-serif;text-align:center;pointer-events:auto;cursor:pointer;will-change:transform;box-shadow:0 1px 6px rgba(0,0,0,.6)}
  .badge.sel{background:#22d3ee;box-shadow:0 0 0 4px rgba(34,211,238,.35)}
  #top{position:absolute;left:12px;top:8px;right:12px;pointer-events:none}
  #top h1{margin:0;font-size:17px}
  @media (max-width:800px){#top h1 .opt{display:none}}
  #top h1 span{color:#ff7a1a}
  #top p{margin:2px 0 0;font-size:12px;color:#9fb0c9}
  #tabs{position:absolute;left:8px;right:8px;top:54px;display:flex;gap:6px;flex-wrap:wrap}
  #tabs button{background:#1a2438;color:#c9d6ec;border:1px solid #33425f;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  #tabs button.on{background:#ff7a1a;border-color:#ff7a1a;color:#10131a}
  #bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:center;pointer-events:none}
  #ctl{pointer-events:auto;width:100%;max-width:560px;background:rgba(16,23,38,.9);border:1px solid #2b3a58;border-radius:12px;padding:9px 12px;font-size:13px}
  #ctl:empty{display:none}
  #ctl .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  #ctl .row:last-child{margin-bottom:0}
  #ctl label{color:#9fb0c9;min-width:64px}
  #ctl input[type=range]{flex:1;min-width:120px;accent-color:#ff7a1a}
  #ctl select{background:#1a2438;color:#e8edf5;border:1px solid #33425f;border-radius:8px;padding:5px 8px;font-size:13px}
  #ctl .seg button{background:#1a2438;color:#dbe4f3;border:1px solid #33425f;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:600}
  #ctl .seg button:first-child{border-radius:8px 0 0 8px}
  #ctl .seg button:last-child{border-radius:0 8px 8px 0}
  #ctl .seg button.on{background:#ff7a1a;border-color:#ff7a1a;color:#10131a}
  #ctl .res{color:#e8edf5;line-height:1.45}
  #ctl .res b{color:#ffb070}
  #panel{width:360px;flex:none;overflow:auto;background:#101726;border-left:1px solid #22304a;padding:14px}
  #list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
  #list button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#172036;color:#dbe4f3;border:1px solid transparent;border-radius:8px;padding:7px 9px;font-size:14px;cursor:pointer}
  #list button:hover{background:#1e2a45}
  #list button.sel{border-color:#22d3ee;background:#16314a}
  #list .n{flex:none;width:22px;height:22px;border-radius:50%;background:#ff7a1a;color:#10131a;font-weight:700;font-size:12px;display:grid;place-items:center}
  #list button.sel .n{background:#22d3ee}
  #detail h2{margin:0 0 8px;font-size:18px}
  #detail h3{margin:12px 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#ff9a4d}
  #detail p{margin:0;line-height:1.5;font-size:14.5px;color:#d3dcec}
  #detail .legend{margin-top:12px;font-size:12.5px;color:#8fa1bd}
  @media (max-width:800px){
    #app{flex-direction:column}
    #panel{width:100%;max-height:44%;border-left:0;border-top:1px solid #22304a;padding:10px 12px}
    #list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    #list li{flex:none}
    #list button{width:auto;padding:4px}
    #list .name{display:none}
    #list .n{width:28px;height:28px;font-size:13px}
    #detail h2{font-size:16px}
    #detail p{font-size:14px}
    #top h1{font-size:15px}
    #top p{display:none}
    #tabs{top:34px}
    #tabs button{padding:5px 10px;font-size:12px}
    #ctl{font-size:12px;padding:7px 9px}
  }

  #net{position:absolute;right:10px;top:8px;display:flex;gap:6px;align-items:center;z-index:5;font-size:11px}
  #netTxt{padding:4px 9px;border-radius:20px;background:#1a2438;border:1px solid #33425f;color:#9fb0c9;white-space:nowrap}
  #net.ok #netTxt{color:#4ade80;border-color:#1f6b3f}
  #inst{background:#ff7a1a;color:#10131a;border:0;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
  #inst[hidden]{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="badges"></div>
    <div id="net"><span id="netTxt">Préparation hors ligne…</span><button id="inst" hidden>Installer</button></div>
    <div id="top"><h1>Les mesures de l'informatique <span class="opt"> en 3D</span></h1><p>Glisse pour tourner · molette ou pincer pour zoomer · touche un numéro</p></div>
    <div id="tabs"></div>
    <div id="bar"><div id="ctl"></div></div>
  </div>
  <aside id="panel">
    <ul id="list"></ul>
    <div id="detail"></div>
  </aside>
</div>

<script src="three.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Outils ---------- */
  function M(color, o) { return new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.5, metalness: 0.2 }, o || {})); }
  function box(w, h, d, mat, x, y, z) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x || 0, y || 0, z || 0); return m; }
  function at(o, x, y, z) { o.position.set(x, y, z); return o; }
  function fr(n, d) { return n.toLocaleString("fr-FR", { maximumFractionDigits: d == null ? 1 : d }); }
  function label(l1, l2, scale) {
    var c = document.createElement("canvas"); c.width = 512; c.height = 180;
    var x = c.getContext("2d"); x.textAlign = "center";
    x.shadowColor = "rgba(0,0,0,.9)"; x.shadowBlur = 8;
    var f1 = 78; x.font = "bold " + f1 + "px Arial"; while (x.measureText(l1).width > 470 && f1 > 30) { f1 -= 4; x.font = "bold " + f1 + "px Arial"; }
    x.fillStyle = "#ffffff"; x.fillText(l1, 256, l2 ? 85 : 115);
    if (l2) { var f2 = 40; x.font = f2 + "px Arial"; while (x.measureText(l2).width > 480 && f2 > 20) { f2 -= 2; x.font = f2 + "px Arial"; } x.fillStyle = "#a9bbd8"; x.fillText(l2, 256, 145); }
    var t = new THREE.CanvasTexture(c);
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
    s.renderOrder = 10; s.scale.set(3.4 * (scale || 1), 1.2 * (scale || 1), 1); return s;
  }
  function grid(size) { var g = new THREE.GridHelper(size, size, 0x2a3a5a, 0x16213a); return g; }

  /* ---------- Moteur commun ---------- */
  var canvas = document.getElementById("c"), stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene(), FOV = 40;
  var camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 300);
  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x223044, 0.85));
  var d1 = new THREE.DirectionalLight(0xffffff, 0.95); d1.position.set(6, 14, 9); scene.add(d1);
  var d2 = new THREE.DirectionalLight(0x88aaff, 0.5); d2.position.set(-9, 4, -6); scene.add(d2);
  var world = new THREE.Group(); scene.add(world);

  var target = new THREE.Vector3(0, 1.5, 0), theta = 0.5, phi = 1.1, radius = 18, radiusTarget = 18, autoFit = true, fitW = 16, dragging = false;
  function applyCamera() {
    camera.position.set(target.x + radius * Math.sin(phi) * Math.sin(theta), target.y + radius * Math.cos(phi), target.z + radius * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(target);
  }
  function fitRadius() { radiusTarget = Math.max(10, fitW / (2 * Math.tan(FOV * Math.PI / 360) * camera.aspect), fitW * 0.55); }
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); if (autoFit) fitRadius();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);

  var pointers = new Map(), down = null, pinch0 = 0;
  function pdist() { var a = Array.from(pointers.values()); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
  function clampR(r) { return Math.min(70, Math.max(5, r)); }
  canvas.addEventListener("pointerdown", function (ev) {
    canvas.setPointerCapture(ev.pointerId); pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size === 1) { down = { moved: 0 }; dragging = true; } else if (pointers.size === 2) { pinch0 = pdist(); down = null; }
  });
  canvas.addEventListener("pointermove", function (ev) {
    var pr = pointers.get(ev.pointerId); if (!pr) return;
    var dx = ev.clientX - pr.x, dy = ev.clientY - pr.y; pr.x = ev.clientX; pr.y = ev.clientY;
    if (pointers.size === 1) { theta -= dx * 0.008; phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - dy * 0.008)); if (down) down.moved += Math.abs(dx) + Math.abs(dy); }
    else if (pointers.size === 2) { var d = pdist(); if (pinch0 > 0) { radius = clampR(radius * pinch0 / d); radiusTarget = radius; autoFit = false; } pinch0 = d; }
  });
  function endPointer(ev) {
    var had = pointers.delete(ev.pointerId);
    if (had && ev.type === "pointerup" && down && pointers.size === 0 && down.moved < 6) pick(ev.clientX, ev.clientY);
    if (pointers.size === 0) { dragging = false; down = null; }
  }
  canvas.addEventListener("pointerup", endPointer); canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("wheel", function (ev) { ev.preventDefault(); radius = clampR(radius * Math.exp(ev.deltaY * 0.001)); radiusTarget = radius; autoFit = false; }, { passive: false });

  /* ---------- Scène courante, éléments numérotés ---------- */
  var items = [], updaters = [], selected = 0, current = null;
  var badgesEl = document.getElementById("badges"), listEl = document.getElementById("list"), detailEl = document.getElementById("detail"), ctlEl = document.getElementById("ctl"), tabsEl = document.getElementById("tabs");
  var ray = new THREE.Raycaster();

  function pick(cx, cy) {
    var r = canvas.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1), camera);
    var hits = ray.intersectObjects(world.children, true);
    for (var i = 0; i < hits.length; i++) {
      var o = hits[i].object;
      while (o && !o.userData.itemId) o = o.parent;
      if (o) { select(o.userData.itemId); return; }
    }
  }
  function mats(o) { var a = []; o.traverse(function (n) { if (n.material) (Array.isArray(n.material) ? n.material : [n.material]).forEach(function (m) { a.push(m); }); }); return a; }
  function setGlow(obj, on) {
    mats(obj).forEach(function (m) {
      if (m.emissive) {
        if (!m.userData.e0) { m.userData.e0 = m.emissive.clone(); m.userData.ei0 = m.emissiveIntensity; }
        if (on) { m.emissive.set(0xff7a00); m.emissiveIntensity = 0.55; } else { m.emissive.copy(m.userData.e0); m.emissiveIntensity = m.userData.ei0; }
      } else if (m.color && !m.isMeshBasicMaterial) {
        if (!m.userData.c0) m.userData.c0 = m.color.clone();
        if (on) m.color.set(0x22d3ee); else m.color.copy(m.userData.c0);
      }
    });
  }
  function select(id) {
    selected = id;
    items.forEach(function (it) { var on = it.id === id; setGlow(it.obj, on); it.badge.classList.toggle("sel", on); it.btn.classList.toggle("sel", on); });
    var it = items.filter(function (i) { return i.id === id; })[0]; if (!it) return;
    detailEl.innerHTML = "<h2>" + id + ". " + it.name + "</h2><h3>Définition</h3><p>" + it.def + "</p><h3>Rôle</h3><p>" + it.role + "</p>" + (it.example ? "<h3>Exemple</h3><p>" + it.example + "</p>" : "");
  }

  var api = {
    add: function (o) { world.add(o); return o; },
    item: function (id, name, def, role, obj, anchor, example) {
      obj.userData.itemId = id;
      var a = new THREE.Object3D(); a.position.set(anchor[0], anchor[1], anchor[2]); obj.add(a);
      var b = document.createElement("div"); b.className = "badge"; b.textContent = id; b.addEventListener("click", function () { select(id); }); badgesEl.appendChild(b);
      var li = document.createElement("li"), bt = document.createElement("button");
      bt.innerHTML = '<span class="n">' + id + '</span><span class="name">' + name + "</span>"; bt.setAttribute("aria-label", id + ". " + name);
      bt.addEventListener("click", function () { select(id); }); li.appendChild(bt); listEl.appendChild(li);
      items.push({ id: id, name: name, def: def, role: role, example: example, obj: obj, anchor: a, badge: b, btn: bt });
    },
    update: function (fn) { updaters.push(fn); },
    controls: function (html, bind) { ctlEl.innerHTML = html; if (bind) bind(ctlEl); },
    seg: function (el, sel, cb) {
      var bs = el.querySelectorAll(sel + " button");
      bs.forEach(function (b) { b.addEventListener("click", function () { bs.forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); cb(b.getAttribute("data-v")); }); });
    }
  };

  function disposeWorld() {
    world.traverse(function (o) { if (o.geometry) o.geometry.dispose(); if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(function (m) { if (m.map) m.map.dispose(); m.dispose(); }); });
    while (world.children.length) world.remove(world.children[0]);
    badgesEl.innerHTML = ""; listEl.innerHTML = ""; ctlEl.innerHTML = ""; items = []; updaters = []; selected = 0;
  }
  function switchScene(key) {
    var S = SCENES[key]; if (!S) return;
    disposeWorld(); current = key; S.build(api);
    target.set(S.target[0], S.target[1], S.target[2]); theta = S.view[0]; phi = S.view[1]; fitW = S.fit; autoFit = true; fitRadius(); radius = radiusTarget;
    detailEl.innerHTML = "<h2>" + S.title + "</h2><p>" + S.intro + '</p><p class="legend">' + S.hint + "</p>";
    Array.prototype.forEach.call(tabsEl.children, function (b) { b.classList.toggle("on", b.getAttribute("data-k") === key); });
  }

  /* =====================================================
     SCÈNE 1 : STOCKAGE (bit → pétaoctet) + flux de bits
     ===================================================== */
  var SCENES = {};
  SCENES.stock = {
    label: "Stockage", target: [0, 1.2, 0], view: [0.45, 1.12], fit: 20,
    title: "L'échelle des octets",
    intro: "Toute information (texte, photo, musique, film) est stockée sous forme de 0 et de 1. Ici, chaque bloc est une unité plus grande que la précédente. Les petits cubes qui défilent derrière sont un flux de bits.",
    hint: "Touche un numéro pour voir la définition. Pour passer d'une unité à la suivante, on multiplie par 1000 (ou par 1024 dans l'usage historique ; les normes Kio, Mio, Gio désignent précisément le 1024).",
    build: function (A) {
      A.add(grid(30));
      var cols = [0x22d3ee, 0x38bdf8, 0x60a5fa, 0x818cf8, 0xa78bfa, 0xf472b6, 0xff7a1a];
      var sizes = [0.3, 0.64];
      for (var i = 2; i < 7; i++) sizes.push(sizes[i - 1] * 1.4);
      var gap = 0.95, total = sizes.reduce(function (a, b) { return a + b; }, 0) + gap * 6, x = -total / 2;
      var info = [
        ["Bit", "La plus petite unité d'information : un 0 ou un 1, comme un interrupteur éteint ou allumé.", "Tout ce que fait un ordinateur (texte, image, son, vidéo) est écrit avec des suites de bits.", "Un seul bit : « oui » ou « non ».", "1 bit", "0 ou 1"],
        ["Octet (o)", "Un groupe de 8 bits. Avec 8 bits, on peut former 256 combinaisons différentes (2 puissance 8).", "C'est l'unité de base pour mesurer la taille des données. Un octet suffit souvent pour une lettre ou un chiffre.", "Le mot « Salut » prend environ 5 octets.", "1 octet", "= 8 bits"],
        ["Kilooctet (Ko)", "Environ 1 000 octets (1 024 dans l'usage historique).", "Sert à mesurer les très petits fichiers.", "Un petit fichier texte ou un court e-mail sans pièce jointe : quelques Ko.", "1 Ko", "≈ 1 000 octets"],
        ["Mégaoctet (Mo)", "Environ 1 000 Ko, soit un million d'octets.", "Sert à mesurer les fichiers courants.", "Une photo de téléphone : environ 2 à 5 Mo. Une chanson : 3 à 5 Mo.", "1 Mo", "≈ 1 000 Ko"],
        ["Gigaoctet (Go)", "Environ 1 000 Mo, soit un milliard d'octets.", "Sert à mesurer la mémoire vive (RAM), les clés USB, les films et les applications.", "Un film HD : 1 à 4 Go. La RAM d'un PC : souvent 8 ou 16 Go.", "1 Go", "≈ 1 000 Mo"],
        ["Téraoctet (To)", "Environ 1 000 Go, soit mille milliards d'octets.", "Sert à mesurer la capacité des disques durs et SSD.", "Un disque dur de 1 To peut contenir des centaines de films.", "1 To", "≈ 1 000 Go"],
        ["Pétaoctet (Po)", "Environ 1 000 To, soit un million de milliards d'octets.", "Sert à mesurer les données des grands centres de données.", "Les serveurs d'un grand réseau social ou d'un service de vidéo en ligne stockent des Po.", "1 Po", "≈ 1 000 To"]
      ];
      for (var k = 0; k < 7; k++) {
        var s = sizes[k], cx = x + s / 2; x += s + gap;
        var mat = M(cols[k], { emissive: cols[k], emissiveIntensity: 0.18, roughness: 0.4 });
        var obj;
        if (k === 1) {
          obj = new THREE.Group();
          for (var a = 0; a < 2; a++) for (var b = 0; b < 2; b++) for (var c = 0; c < 2; c++)
            obj.add(box(0.3, 0.3, 0.3, mat, (a - 0.5) * 0.34, 0.15 + b * 0.34, (c - 0.5) * 0.34));
          obj.position.set(cx, 0, 0);
        } else if (k === 0) { obj = box(s, s, s, mat, cx, s / 2, 0); }
        else { obj = box(s, s, s, mat, cx, s / 2, 0); }
        A.add(obj);
        var top = k === 0 ? 0.3 : (k === 1 ? 0.64 : s);
        A.item(k + 1, info[k][0], info[k][1], info[k][2], obj, k === 1 ? [0, top + 0.35, 0] : [0, k === 0 ? top / 2 + 0.3 : s / 2 + 0.35, 0], info[k][3]);
        var lb = label(info[k][4], info[k][5], 0.8); lb.position.set(cx, -0.55, 1.2); A.add(lb);
      }
      // flux de bits
      var rail = box(total + 4, 0.04, 0.5, M(0x1f3350, { roughness: 0.8 }), 0, 0.02, -3);
      A.add(rail);
      var N = 40, inst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), M(0x22d3ee, { emissive: 0x22d3ee, emissiveIntensity: 0.6 }), N);
      A.add(inst); var dummy = new THREE.Object3D(), L = total + 4, off = 0;
      var fl = label("Flux de bits", "0 1 0 0 1 1 0 1 …", 0.8); fl.position.set(-total / 2 - 1.2, 0.9, -3); A.add(fl);
      A.update(function (dt) {
        off += dt * 1.8;
        for (var i = 0; i < N; i++) {
          var p = ((i * (L / N)) + off) % L; dummy.position.set(-L / 2 + p, 0.2, -3);
          dummy.rotation.y = off + i; dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix);
        }
        inst.instanceMatrix.needsUpdate = true;
      });
      A.controls("", null);
    }
  };

  /* =====================================================
     SCÈNE 2 : DÉBIT (bit/s) + latence
     ===================================================== */
  SCENES.debit = {
    label: "Débit", target: [0, 1.3, 0], view: [0.35, 1.15], fit: 19,
    title: "Le débit : combien de données par seconde",
    intro: "Un serveur envoie des données à un ordinateur à travers un câble. Les cubes sont des paquets de données. Plus le débit est grand, plus il en passe vite.",
    hint: "Bouge le curseur de débit et choisis un fichier : le temps de téléchargement est calculé pour toi. Les fichiers se comptent en octets, le débit en bits : il faut multiplier la taille par 8.",
    build: function (A) {
      A.add(grid(26));
      var srv = new THREE.Group();
      srv.add(box(1.8, 2.2, 1.5, M(0x2b3a55, { metalness: 0.4 }), 0, 1.1, 0));
      for (var i = 0; i < 3; i++) { srv.add(box(1.5, 0.12, 0.05, M(0x0e1420), 0, 0.5 + i * 0.6, 0.78)); srv.add(box(0.1, 0.1, 0.06, M(0x22d3ee, { emissive: 0x22d3ee, emissiveIntensity: 0.9 }), 0.6, 0.5 + i * 0.6, 0.8)); }
      srv.position.set(-6.5, 0, 0); A.add(srv);
      A.item(1, "Source (serveur)", "L'ordinateur qui envoie les données : un site web, un service de vidéo, un serveur de jeux.", "Il stocke l'information et la découpe en paquets avant de l'envoyer sur le réseau.", srv, [0, 2.7, 0], "Quand tu regardes une vidéo en ligne, le serveur de la plateforme est la source.");

      var pipe = new THREE.Group();

      var rf = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.07, 10, 32), M(0x4ade80, { emissive: 0x4ade80, emissiveIntensity: 0.5 })); rf.position.set(-W / 2 - 1.2, cy - H / 2 + 0.4, 0.2); A.add(rf);

  var last = performance.now(), tmp = new THREE.Vector3();
